services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nugas
      POSTGRES_USER: nugas_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - nugas_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nugas_user -d nugas"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # only reachable from the server itself; the public site goes through the Caddy reverse proxy
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DATABASE_URL: postgres://nugas_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nugas
      PGSSLMODE: disable
      TRUST_PROXY: ${TRUST_PROXY:-false}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      SHOW_DEV_OTP: "false"
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Hormozgan coverage map: page stays hidden (admins can preview) until FEATURE_COVERAGE_MAP=true;
      # Map.ir base-map tiles are used while MAPIR_API_KEY holds an unexpired key, otherwise OSM/CARTO.
      FEATURE_COVERAGE_MAP: ${FEATURE_COVERAGE_MAP:-false}
      MAPIR_API_KEY: ${MAPIR_API_KEY:-}
      # «دستیار مبحث ۱۷»: page shown when FEATURE_AI_ASSISTANT=true; AI answers need AI_API_KEY (GapGPT).
      FEATURE_AI_ASSISTANT: ${FEATURE_AI_ASSISTANT:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.gapapi.com/v1}
      AI_MODEL_ANSWER: ${AI_MODEL_ANSWER:-}
      AI_MODEL_EMBED: ${AI_MODEL_EMBED:-}
      # Help centre AI («پشتیبان هوشمند»): answers, ticket sorting, reply drafts. Off → FAQ search and keyword rules.
      FEATURE_AI_SUPPORT: ${FEATURE_AI_SUPPORT:-false}
      AI_MODEL_SUPPORT: ${AI_MODEL_SUPPORT:-}
      AI_MODEL_SUPPORT_TRIAGE: ${AI_MODEL_SUPPORT_TRIAGE:-}
      AI_MODEL_SUPPORT_DRAFT: ${AI_MODEL_SUPPORT_DRAFT:-}
      # Emergency stop for every AI feature at once (true = all fall back to non-AI behaviour).
      AI_KILL_SWITCH: ${AI_KILL_SWITCH:-false}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-300}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-3000000}
    volumes:
      - nugas_uploads:/app/uploads
volumes:
  nugas_db:
  nugas_uploads:
